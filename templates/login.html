
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login | Spend Story</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #F7F4FC;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }

        .card {
            width: 100%;
            max-width: 420px;
            padding: 38px;
            background: white;
            border-radius: 22px;
            box-shadow: 0 12px 40px rgba(37, 27, 53, 0.12);
        }

        .brand {
            text-align: center;
            color: #7652B5;
            font-size: 25px;
            font-weight: bold;
        }

        h1 {
            text-align: center;
            color: #251B35;
            margin-top: 28px;
        }

        .subtitle {
            text-align: center;
            color: #777;
            margin-bottom: 28px;
        }

        label {
            display: block;
            margin: 18px 0 8px;
            font-weight: 600;
            color: #251B35;
        }

        input {
            width: 100%;
            padding: 14px;
            border: 1px solid #ded8e9;
            border-radius: 10px;
            font-size: 15px;
        }

        button {
            width: 100%;
            padding: 14px;
            margin-top: 25px;
            border: none;
            border-radius: 10px;
            background: #7652B5;
            color: white;
            font-size: 16px;
            cursor: pointer;
        }

        button:hover {
            background: #604098;
        }

        .switch {
            text-align: center;
            margin-top: 24px;
            color: #777;
        }

        a {
            color: #7652B5;
            font-weight: bold;
            text-decoration: none;
        }

        .message {
            background: #f7e9e9;
            color: #8a3030;
            padding: 12px;
            border-radius: 8px;
            margin-bottom: 12px;
        }
    </style>
</head>

<body>
    <main class="card">

        <div class="brand">✳ Spend Story</div>

        <h1>Welcome back!</h1>
        <p class="subtitle">Continue your financial story.</p>

        {% with messages = get_flashed_messages(with_categories=true) %}
            {% if messages %}
                {% for category, message in messages %}
                    <div class="message">{{ message }}</div>
                {% endfor %}
            {% endif %}
        {% endwith %}

        <form method="POST" action="{{ url_for('login') }}">

            <input type="hidden"
                   name="csrf_token"
                   value="{{ csrf_token }}">

            <label for="email">Email address</label>
            <input type="email"
                   id="email"
                   name="email"
                   required>

            <label for="password">Password</label>
            <input type="password"
                   id="password"
                   name="password"
                   required>

            <button type="submit">Login →</button>
        </form>

        <p class="switch">
            Don't have an account?
            <a href="{{ url_for('register') }}">Create account</a>
        </p>

    </main>
</body>
</html>
